name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Read app version
      id: version
      run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Verify release tag matches package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        if [ "v${{ steps.version.outputs.value }}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${{ steps.version.outputs.value }}"
          exit 1
        fi

    - name: Install NPM Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Type Check
      run: npm run type-check

    - name: Run Tests
      run: npm test

    - name: Build Web Assets
      run: npm run build

    - name: Check Android version is in sync
      run: node scripts/sync-android-version.mjs --check

    - name: Sync Web Assets to Android
      run: npm run cap:sync

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # The debug keystore is committed (android/app/debug.keystore) so every build is
    # signed with the same key and installs as an in-place update over the previous APK.
    - name: Build APK
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew clean assembleDebug

    - name: Name APK with version
      run: |
        mkdir -p release
        cp android/app/build/outputs/apk/debug/app-debug.apk "release/bspr-curriculum-app-v${{ steps.version.outputs.value }}.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bspr-curriculum-app-v${{ steps.version.outputs.value }}
        path: release/bspr-curriculum-app-v${{ steps.version.outputs.value }}.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: bspr-curriculum-app-v${{ needs.build.outputs.version }}
        path: release

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          "release/bspr-curriculum-app-v${{ needs.build.outputs.version }}.apk" \
          --repo "${GITHUB_REPOSITORY}" \
          --title "BSPR Curriculum ${GITHUB_REF_NAME}" \
          --generate-notes
